name: Taiwan Bullish Screener Email

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"
      timezone: "Asia/Taipei"
    - cron: "0 22 * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: read

concurrency:
  group: taiwan-screener-email
  cancel-in-progress: false

jobs:
  send-email:
    name: Send Taiwan bullish screener email
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Send report
        env:
          SCREENER_EMAIL_TO: ${{ secrets.SCREENER_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          SMTP_USE_TLS: "true"
          SMTP_USE_SSL: "false"
        run: python -m backend.app.email_report
