name: Daily Taiwan Market Screener

on:
  workflow_dispatch:
  schedule:
    # Start a few minutes early because GitHub scheduled jobs are not real-time.
    - cron: "59 21 * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: write

concurrency:
  group: taiwan-screener-email
  cancel-in-progress: true

jobs:
  refresh-and-send:
    name: Refresh official market data and send report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Refresh complete Taiwan market data
        timeout-minutes: 5
        continue-on-error: true
        run: >-
          python -m backend.app.export_static
          --full-taiwan-market
          --official-daily
          --min-score 0
          --max-pe 999
          --include-non-bullish

      - name: Send report
        if: always()
        env:
          SCREENER_EMAIL_TO: ${{ secrets.SCREENER_EMAIL_TO }}
          SCREENER_EMAIL_ADDITIONAL_TO: ${{ secrets.SCREENER_EMAIL_ADDITIONAL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          SMTP_USE_TLS: "true"
          SMTP_USE_SSL: "false"
        run: |
          for attempt in 1 2 3; do
            python -m backend.app.email_report --data public/data/screener-data.json && exit 0
            echo "Email attempt ${attempt} failed; retrying..."
            sleep 20
          done
          exit 1

      - name: Publish latest dataset
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/screener-data.json backend/config/taiwan_universe.csv backend/data/taiwan_history.json backend/data/email_report_history.json
          git diff --cached --quiet || git commit -m "Update daily Taiwan market data"
          git push
